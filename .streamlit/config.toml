# Look of the site. Owner: role F (Interface and 3D).
# Clean light look: light grey page, white cards, near-black text, flame orange as the main colour.
# Font, spacing and shapes are in flame/ui/style.py. The 3D scenes keep their own space background.
[theme]
base = "light"
primaryColor = "#e0662a"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"

[client]
# Hide the developer menu for visitors.
toolbarMode = "minimal"
