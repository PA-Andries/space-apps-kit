# Look of the site. Owner: role F (Interface and 3D).
# Space look: a deep night-blue page with nebula glows and stars, frosted-glass cards, light text,
# flame orange as the main colour. The universe itself (stars, nebulae, glass) is in flame/ui/style.py.
[theme]
base = "dark"
primaryColor = "#e8622a"
backgroundColor = "#070a1c"
secondaryBackgroundColor = "#141a3a"
textColor = "#e9ecf8"

[client]
# Hide the developer menu for visitors.
toolbarMode = "minimal"
