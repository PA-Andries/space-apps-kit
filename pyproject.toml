[project]
name = "space-apps-kit"
version = "0.1.0"
description = "Team tooling for NASA Space Apps 2026 Paris: Claude Code skills, rules and a submission checker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5",
]

[project.scripts]
check-submission = "space_apps_kit.submission:main"

[dependency-groups]
# Installed by default with `uv sync`: what CI runs.
dev = [
    "pytest>=8",
    "ruff>=0.14",
]
# NASA data sampling stack for /data-recon: `uv sync --group data`.
data = [
    "earthaccess",
    "geopandas",
    "h5netcdf",
    "jupyterlab",
    "matplotlib",
    "netcdf4",
    "pandas",
    "pystac-client",
    "rasterio",
    "requests",
    "rioxarray",
    "xarray",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
