[project]
name = "space-apps-kit"
version = "0.1.0"
description = "Flame in Freefall: NASA Space Apps 2026 Paris project (Streamlit app, team tooling, submission checker)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pypdf>=5",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[project.scripts]
check-submission = "space_apps_kit.submission:main"
verifier = "space_apps_kit.verifier:main"

[dependency-groups]
# Installed by default with `uv sync`: what `uv run verifier` needs.
dev = [
    "pytest>=8",
    "ruff>=0.14",
]
# NASA data sampling stack: `uv sync --group data`.
data = [
    "earthaccess",
    "geopandas",
    "h5netcdf",
    "jupyterlab",
    "matplotlib",
    "netcdf4",
    "pandas",
    "pystac-client",
    "rasterio",
    "requests",
    "rioxarray",
    "xarray",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["flame", "space_apps_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
