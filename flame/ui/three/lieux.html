<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      canvas { display: block; }
      #erreur { color: #9ca3af; font: 14px sans-serif; padding: 16px; }
    </style>
  </head>
  <body>
    <script type="module">
      // Les lieux côte à côte, en style cartoon : Terre, vaisseau, station, base lunaire, base martienne, rover.
      // Dessins simplifiés faits ici, sans image extérieure. Le lieu choisi grossit, tourne et s'entoure d'un halo.
      // Le clic est reçu par les boutons Streamlit posés par-dessus la scène : la scène ne renvoie rien à Python.
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

      const reglages = __REGLAGES__; // remplacé par Python : { lieux: [...], choisi: index du lieu choisi, ou -1 }
      const mouvementReduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      } catch (e) {
        document.body.innerHTML = '<p id="erreur">La scène 3D demande WebGL, indisponible sur ce navigateur.</p>';
        throw e;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      // Caméra orthographique : chaque lieu occupe une colonne de même largeur, comme les boutons.
      const nb = reglages.lieux.length;
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-nb / 2, nb / 2, 1, -1, 0.1, 20);
      camera.position.set(0, -0.12, 10);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.1));
      const soleil = new THREE.DirectionalLight(0xffffff, 2.4);
      soleil.position.set(-3, 3, 5);
      scene.add(soleil);

      // --- Le style cartoon : trois tons d'ombre nets et un contour sombre ---------------------------
      const tons = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.RedFormat);
      tons.minFilter = tons.magFilter = THREE.NearestFilter;
      tons.needsUpdate = true;

      const CONTOUR = new THREE.MeshBasicMaterial({ color: "#0f172a", side: THREE.BackSide });

      const toon = (couleur, options = {}) => new THREE.MeshToonMaterial({ color: couleur, gradientMap: tons, ...options });

      // Une pièce : la forme, plus un contour (la même forme un peu plus grande, vue de l'intérieur).
      const piece = (geometrie, materiau, epaisseur = 1.07) => {
        const maille = new THREE.Mesh(geometrie, materiau);
        const contour = new THREE.Mesh(geometrie, CONTOUR);
        contour.scale.setScalar(epaisseur);
        maille.add(contour);
        return maille;
      };

      // --- Les textures dessinées sur une toile -----------------------------------------------------
      const toile = (dessin, largeur = 256, hauteur = 128) => {
        const c = document.createElement("canvas");
        c.width = largeur;
        c.height = hauteur;
        dessin(c.getContext("2d"), largeur, hauteur);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      };

      let graine = 11;
      const hasard = () => (graine = (graine * 16807) % 2147483647) / 2147483647;

      const taches = (p, couleurs, nombre, rayonMin, rayonMax, l, h) => {
        for (let i = 0; i < nombre; i++) {
          p.fillStyle = couleurs[i % couleurs.length];
          const x = hasard() * l;
          const y = h * 0.18 + hasard() * h * 0.64;
          // Une tache = quelques ronds collés : contours doux, façon dessin animé.
          for (let k = 0; k < 4; k++) {
            p.beginPath();
            p.arc(x + (hasard() - 0.5) * rayonMax, y + (hasard() - 0.5) * rayonMax * 0.6, rayonMin + hasard() * (rayonMax - rayonMin), 0, 7);
            p.fill();
          }
        }
      };

      const calottes = (p, l, h, couleur = "#f8fafc") => {
        p.fillStyle = couleur;
        p.fillRect(0, 0, l, h * 0.09);
        p.fillRect(0, h * 0.91, l, h * 0.09);
      };

      const carteTerre = toile((p, l, h) => {
        p.fillStyle = "#38bdf8";
        p.fillRect(0, 0, l, h);
        taches(p, ["#4ade80", "#22c55e", "#facc15"], 9, 8, 22, l, h);
        calottes(p, l, h);
      });
      const carteNuages = toile((p, l, h) => {
        taches(p, ["rgba(255,255,255,0.95)"], 10, 4, 10, l, h);
      });
      const carteLune = toile((p, l, h) => {
        p.fillStyle = "#e2e8f0";
        p.fillRect(0, 0, l, h);
        for (let i = 0; i < 22; i++) {
          const x = hasard() * l, y = 10 + hasard() * (h - 20), r = 3 + hasard() * 9;
          p.fillStyle = "#94a3b8";
          p.beginPath(); p.arc(x, y, r, 0, 7); p.fill();
          p.fillStyle = "#cbd5e1";
          p.beginPath(); p.arc(x - r * 0.25, y - r * 0.25, r * 0.65, 0, 7); p.fill();
        }
      });
      const carteMars = toile((p, l, h) => {
        p.fillStyle = "#fb923c";
        p.fillRect(0, 0, l, h);
        taches(p, ["#ea580c", "#c2410c", "#fdba74"], 10, 6, 18, l, h);
        calottes(p, l, h, "#fff7ed");
      });
      const cartePanneau = toile((p, l, h) => {
        p.fillStyle = "#2563eb";
        p.fillRect(0, 0, l, h);
        p.strokeStyle = "#93c5fd";
        p.lineWidth = 4;
        for (let x = 0; x <= l; x += l / 4) { p.beginPath(); p.moveTo(x, 0); p.lineTo(x, h); p.stroke(); }
        for (let y = 0; y <= h; y += h / 6) { p.beginPath(); p.moveTo(0, y); p.lineTo(l, y); p.stroke(); }
      }, 64, 128);

      // --- Les objets -------------------------------------------------------------------------------
      const RAYON = 0.32;
      const verre = toon("#7dd3fc", { transparent: true, opacity: 0.85 });
      const blanc = toon("#f8fafc");
      const gris = toon("#64748b");
      const orange = toon("#f97316");
      const sombre = toon("#1e293b");

      const planete = (carte) => piece(new THREE.SphereGeometry(RAYON, 48, 32), toon("#ffffff", { map: carte }), 1.05);

      // Un petit dôme d'habitat avec son antenne, posé au sommet d'une planète.
      const dome = () => {
        const g = new THREE.Group();
        const bulle = piece(new THREE.SphereGeometry(0.11, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), verre, 1.1);
        const socle = piece(new THREE.CylinderGeometry(0.125, 0.135, 0.04, 24), blanc, 1.1);
        socle.position.y = -0.01;
        const mat = piece(new THREE.CylinderGeometry(0.008, 0.008, 0.12, 8), gris, 1.3);
        mat.position.set(0.1, 0.06, 0);
        const boule = piece(new THREE.SphereGeometry(0.022, 12, 12), orange, 1.2);
        boule.position.set(0.1, 0.13, 0);
        g.add(socle, bulle, mat, boule);
        g.position.y = RAYON - 0.02;
        return g;
      };

      const terre = () => {
        const g = new THREE.Group();
        g.add(planete(carteTerre));
        const nuages = new THREE.Mesh(
          new THREE.SphereGeometry(RAYON * 1.04, 48, 32),
          toon("#ffffff", { map: carteNuages, transparent: true, depthWrite: false }),
        );
        nuages.userData.tourneEnPlus = 0.006;
        g.add(nuages);
        return g;
      };

      const baseLunaire = () => {
        const g = new THREE.Group();
        g.add(planete(carteLune), dome());
        return g;
      };

      const baseMartienne = () => {
        const g = new THREE.Group();
        g.add(planete(carteMars), dome());
        return g;
      };

      const vaisseau = () => {
        const g = new THREE.Group();
        const corps = piece(new THREE.CapsuleGeometry(0.12, 0.2, 8, 24), blanc);
        const bande = piece(new THREE.TorusGeometry(0.122, 0.022, 10, 32), orange, 1.1);
        bande.rotation.x = Math.PI / 2;
        bande.position.y = -0.05;
        const hublot = piece(new THREE.CircleGeometry(0.05, 24), verre, 1.15);
        hublot.position.set(0, 0.07, 0.121);
        const tuyere = piece(new THREE.CylinderGeometry(0.06, 0.09, 0.07, 20), gris);
        tuyere.position.y = -0.25;
        g.add(corps, bande, hublot, tuyere);
        for (const cote of [-1, 1]) {
          const aile = piece(new THREE.BoxGeometry(0.2, 0.12, 0.012), toon("#ffffff", { map: cartePanneau }), 1.08);
          aile.position.set(cote * 0.23, -0.06, 0);
          g.add(aile);
        }
        g.rotation.z = -0.45;
        return g;
      };

      const station = () => {
        const g = new THREE.Group();
        const module = piece(new THREE.CapsuleGeometry(0.06, 0.3, 8, 20), blanc);
        module.rotation.z = Math.PI / 2;
        const noeud = piece(new THREE.SphereGeometry(0.075, 20, 16), blanc);
        const bras = piece(new THREE.CylinderGeometry(0.014, 0.014, 0.85, 8), gris, 1.2);
        bras.rotation.z = Math.PI / 2;
        bras.position.y = 0.13;
        const mat = piece(new THREE.CylinderGeometry(0.012, 0.012, 0.13, 8), gris, 1.2);
        mat.position.y = 0.07;
        g.add(module, noeud, bras, mat);
        for (const x of [-0.34, -0.2, 0.2, 0.34]) {
          const aile = piece(new THREE.BoxGeometry(0.11, 0.34, 0.012), toon("#ffffff", { map: cartePanneau }), 1.06);
          aile.position.set(x, 0.13, 0);
          g.add(aile);
        }
        const bout = piece(new THREE.SphereGeometry(0.03, 12, 12), orange, 1.2);
        bout.position.set(0.21, 0, 0);
        g.add(bout);
        g.rotation.x = 0.3;
        return g;
      };

      const rover = () => {
        const g = new THREE.Group();
        const caisse = piece(new THREE.BoxGeometry(0.46, 0.14, 0.26), blanc, 1.06);
        const bande = piece(new THREE.BoxGeometry(0.47, 0.035, 0.27), orange, 1.04);
        bande.position.y = -0.02;
        const cabine = piece(new THREE.SphereGeometry(0.12, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), verre, 1.08);
        cabine.position.set(0.09, 0.07, 0);
        const mat = piece(new THREE.CylinderGeometry(0.008, 0.008, 0.16, 8), gris, 1.3);
        mat.position.set(-0.16, 0.15, 0.06);
        const boule = piece(new THREE.SphereGeometry(0.025, 12, 12), orange, 1.2);
        boule.position.set(-0.16, 0.24, 0.06);
        g.add(caisse, bande, cabine, mat, boule);
        for (const x of [-0.16, 0, 0.16]) {
          for (const z of [-0.15, 0.15]) {
            const roue = piece(new THREE.CylinderGeometry(0.065, 0.065, 0.05, 20), sombre, 1.08);
            roue.rotation.x = Math.PI / 2;
            roue.position.set(x, -0.1, z);
            const moyeu = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.052, 12), toon("#cbd5e1"));
            roue.add(moyeu);
            g.add(roue);
          }
        }
        g.rotation.set(0.35, -0.55, 0);
        return g;
      };

      const fabriques = {
        Terre: terre,
        Vaisseau: vaisseau,
        Station: station,
        "Base lunaire": baseLunaire,
        "Base martienne": baseMartienne,
        "Rover pressurisé": rover,
      };

      // --- Les étoiles et le halo du lieu choisi ------------------------------------------------------
      const positions = [];
      for (let i = 0; i < 70; i++) positions.push((hasard() - 0.5) * nb, (hasard() - 0.5) * 2, -3);
      const etoiles = new THREE.Points(
        new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(positions, 3)),
        new THREE.PointsMaterial({ color: "#fde68a", size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.7 }),
      );
      scene.add(etoiles);

      const halo = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: toile((p, l) => {
            const d = p.createRadialGradient(l / 2, l / 2, 0, l / 2, l / 2, l / 2);
            d.addColorStop(0, "rgba(249,115,22,0.75)");
            d.addColorStop(0.55, "rgba(249,115,22,0.25)");
            d.addColorStop(1, "rgba(249,115,22,0)");
            p.fillStyle = d;
            p.fillRect(0, 0, l, l);
          }, 128, 128),
          transparent: true,
          depthWrite: false,
        }),
      );
      halo.scale.set(1.15, 1.15, 1);
      halo.position.z = -2;

      const objets = reglages.lieux.map((lieu, i) => {
        const fabrique = fabriques[lieu] ?? (() => planete(carteLune));
        const pivot = new THREE.Group(); // le pivot flotte et tourne, l'objet garde son inclinaison
        pivot.add(fabrique());
        pivot.position.x = -nb / 2 + 0.5 + i;
        const choisi = i === reglages.choisi;
        pivot.scale.setScalar(choisi ? 1.22 : 0.95);
        if (choisi) {
          halo.position.x = pivot.position.x;
          scene.add(halo);
        }
        scene.add(pivot);
        return pivot;
      });

      const redimensionner = () => {
        const largeur = window.innerWidth;
        const hauteur = window.innerHeight;
        renderer.setSize(largeur, hauteur);
        const demiHauteur = (nb / 2) * (hauteur / largeur); // colonnes carrées, quelle que soit la largeur
        camera.top = demiHauteur;
        camera.bottom = -demiHauteur;
        camera.updateProjectionMatrix();
      };
      window.addEventListener("resize", redimensionner);
      redimensionner();

      const dessiner = (temps = 0) => {
        objets.forEach((pivot, i) => {
          const choisi = i === reglages.choisi;
          pivot.rotation.y += choisi ? 0.014 : 0.005;
          pivot.position.y = (choisi ? 0.05 : 0.035) * Math.sin(temps / 650 + i * 1.3);
          pivot.traverse((morceau) => {
            if (morceau.userData.tourneEnPlus) morceau.rotation.y += morceau.userData.tourneEnPlus;
          });
        });
        halo.material.opacity = 0.75 + 0.25 * Math.sin(temps / 450);
        etoiles.material.opacity = 0.55 + 0.2 * Math.sin(temps / 900);
        renderer.render(scene, camera);
      };

      if (mouvementReduit) {
        dessiner();
      } else {
        renderer.setAnimationLoop(dessiner);
      }
    </script>
  </body>
</html>
