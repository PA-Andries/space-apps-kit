<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
      canvas { display: block; }
      #erreur { color: #9ca3af; font: 14px sans-serif; padding: 16px; }
    </style>
  </head>
  <body>
    <script type="module">
      // Illustration qualitative, pas une simulation : la flamme passe d'une sphère bleue et calme
      // (microgravité, l'oxygène arrive par diffusion) à une goutte jaune étirée vers le haut
      // (gravité terrestre, l'air chaud monte). Aucune valeur affichée ici n'est une donnée NASA.
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

      const reglages = __REGLAGES__; // remplacé par Python : { gravite: 0 à 1, oxygene: en % }
      const g = reglages.gravite;
      const mouvementReduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true });
      } catch (e) {
        document.body.innerHTML = '<p id="erreur">La scène 3D demande WebGL, indisponible sur ce navigateur.</p>';
        throw e;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.8, 5.5);
      camera.lookAt(0, 0.3, 0);

      // Plus d'oxygène : flamme un peu plus grande et plus lumineuse (effet visuel, borné).
      const force = Math.min(Math.max(reglages.oxygene / 21, 0.5), 2);
      const taille = 0.45 + 0.15 * force;
      const bleu = new THREE.Color("#3b82f6");
      const jaune = new THREE.Color("#fbbf24");
      const couleur = bleu.clone().lerp(jaune, g);

      // Un dégradé rond, du centre lumineux vers le bord transparent, pour des halos sans bord dur.
      const toile = document.createElement("canvas");
      toile.width = toile.height = 128;
      const pinceau = toile.getContext("2d");
      const degrade = pinceau.createRadialGradient(64, 64, 0, 64, 64, 64);
      degrade.addColorStop(0, "rgba(255,255,255,1)");
      degrade.addColorStop(0.35, "rgba(255,255,255,0.6)");
      degrade.addColorStop(1, "rgba(255,255,255,0)");
      pinceau.fillStyle = degrade;
      pinceau.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(toile);

      const halo = (teinte, opacite) =>
        new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: texture,
            color: teinte,
            transparent: true,
            opacity: Math.min(opacite * force, 1),
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );

      // La flamme : un cœur clair, un halo coloré, et une lueur large et faible.
      const flamme = new THREE.Group();
      const couches = [
        { sprite: halo(couleur.clone().lerp(new THREE.Color("#ffffff"), 0.4), 0.8), largeur: 2.0 },
        { sprite: halo(couleur, 0.6), largeur: 3.0 },
        { sprite: halo(couleur, 0.25), largeur: 5.0 },
      ];
      for (const couche of couches) flamme.add(couche.sprite);
      flamme.position.y = 0.45 * g;
      scene.add(flamme);

      // Le combustible : une goutte grise au centre, dessinée par-dessus la lueur.
      const combustible = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 24, 24),
        new THREE.MeshBasicMaterial({ color: "#6b7280", depthTest: false, transparent: true }),
      );
      combustible.renderOrder = 1;
      scene.add(combustible);

      // Les particules : elles s'éloignent lentement dans toutes les directions en microgravité,
      // et montent avec la gravité.
      const NB_PARTICULES = 260;
      const positions = new Float32Array(NB_PARTICULES * 3);
      const vitesses = [];
      const placer = (i) => {
        const direction = new THREE.Vector3().randomDirection();
        const depart = direction.clone().multiplyScalar(taille * 0.9);
        positions.set([depart.x, depart.y, depart.z], i * 3);
        vitesses[i] = direction.multiplyScalar(0.004 * (1 - g) + 0.002).add(new THREE.Vector3(0, 0.02 * g, 0));
      };
      for (let i = 0; i < NB_PARTICULES; i++) {
        placer(i);
        const avance = Math.random() * 120;
        for (let k = 0; k < 3; k++) positions[i * 3 + k] += vitesses[i].getComponent(k) * avance;
      }
      const geometrie = new THREE.BufferGeometry();
      geometrie.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const particules = new THREE.Points(
        geometrie,
        new THREE.PointsMaterial({
          color: couleur,
          size: 0.04,
          transparent: true,
          opacity: 0.7,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        }),
      );
      scene.add(particules);

      const LIMITE = 3.2;
      const animerParticules = () => {
        for (let i = 0; i < NB_PARTICULES; i++) {
          for (let k = 0; k < 3; k++) positions[i * 3 + k] += vitesses[i].getComponent(k);
          const x = positions[i * 3], y = positions[i * 3 + 1], z = positions[i * 3 + 2];
          if (Math.hypot(x, y, z) > LIMITE) placer(i);
        }
        geometrie.attributes.position.needsUpdate = true;
      };

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const dessiner = (temps = 0) => {
        // Avec la gravité, la flamme vacille ; en microgravité, elle reste presque immobile.
        const vacillement = 0.015 + 0.06 * g;
        const souffle = 1 + vacillement * Math.sin(temps / 180) * Math.sin(temps / 77);
        for (const couche of couches) {
          const largeur = taille * couche.largeur;
          couche.sprite.scale.set(largeur * souffle, largeur * (1 + 1.2 * g) * (2 - souffle), 1);
        }
        animerParticules();
        renderer.render(scene, camera);
      };

      if (mouvementReduit) {
        dessiner();
      } else {
        renderer.setAnimationLoop(dessiner);
      }
    </script>
  </body>
</html>
