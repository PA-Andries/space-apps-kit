<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      canvas { display: block; }
      #error { color: #9ca3af; font: 14px sans-serif; padding: 16px; }
    </style>
  </head>
  <body>
    <script type="module">
      // Cartoon-style 3D objects side by side: celestial bodies (Earth system, Moon, Mars), then the places
      // of a body (planet, station, spacecraft, base, rover). Simple shapes drawn here, no outside image.
      // The chosen object grows, spins and gets a halo. Clicks are received by the Streamlit buttons placed
      // over the scene: the scene sends nothing back to Python.
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

      const settings = __SETTINGS__; // replaced by Python: { objects: [...], chosen: index of the chosen object, or -1 }
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      } catch (e) {
        document.body.innerHTML = '<p id="error">The 3D scene needs WebGL, which this browser does not offer.</p>';
        throw e;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const count = settings.objects.length;
      const scene = new THREE.Scene();
      // Orthographic camera: the visible height is fixed (objects keep their size),
      // the width follows the frame, and each object sits in the middle of its column, like the buttons.
      const HALF_HEIGHT = 0.68;
      const camera = new THREE.OrthographicCamera(-1, 1, HALF_HEIGHT, -HALF_HEIGHT, 0.1, 20);
      camera.position.set(0, -0.12, 10);

      scene.add(new THREE.HemisphereLight(0xfff4e6, 0x151c33, 1.1)); // warm sky, site panel colour below
      const sun = new THREE.DirectionalLight(0xffe2c4, 2.4); // a warm, flame-tinted sun
      sun.position.set(-3, 3, 5);
      scene.add(sun);

      // --- Cartoon style: three sharp shading tones and a dark outline ---------------------------------
      const tones = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.RedFormat);
      tones.minFilter = tones.magFilter = THREE.NearestFilter;
      tones.needsUpdate = true;

      const OUTLINE = new THREE.MeshBasicMaterial({ color: "#0b1020", side: THREE.BackSide }); // site background

      const toon = (color, options = {}) => new THREE.MeshToonMaterial({ color, gradientMap: tones, ...options });

      // A part: the shape, plus an outline (the same shape slightly bigger, seen from inside).
      const part = (geometry, material, thickness = 1.07) => {
        const mesh = new THREE.Mesh(geometry, material);
        const outline = new THREE.Mesh(geometry, OUTLINE);
        outline.scale.setScalar(thickness);
        mesh.add(outline);
        return mesh;
      };

      // --- Textures painted on a canvas -----------------------------------------------------------
      const paint = (drawing, width = 256, height = 128) => {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        drawing(canvas.getContext("2d"), width, height);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      };

      let seed = 11;
      const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

      const blotches = (p, colors, number, minRadius, maxRadius, w, h) => {
        for (let i = 0; i < number; i++) {
          p.fillStyle = colors[i % colors.length];
          const x = random() * w;
          const y = h * 0.18 + random() * h * 0.64;
          // A blotch = a few joined circles: soft, cartoon-like edges.
          for (let k = 0; k < 4; k++) {
            p.beginPath();
            p.arc(x + (random() - 0.5) * maxRadius, y + (random() - 0.5) * maxRadius * 0.6, minRadius + random() * (maxRadius - minRadius), 0, 7);
            p.fill();
          }
        }
      };

      const iceCaps = (p, w, h, color = "#f8fafc") => {
        p.fillStyle = color;
        p.fillRect(0, 0, w, h * 0.09);
        p.fillRect(0, h * 0.91, w, h * 0.09);
      };

      // Planet maps. `k` scales the canvas and its drawing: 1 for the small planets, 4 for the big
      // planet seen up close once zoomed in (so its surface stays sharp).
      const makeEarthMap = (k) =>
        paint((p, w, h) => {
          p.fillStyle = "#3b82f6";
          p.fillRect(0, 0, w, h);
          blotches(p, ["#4ade80", "#34d399", "#fbbf24"], 9, 8 * k, 22 * k, w, h);
          if (k === 1) iceCaps(p, w, h); // the big planet is turned: its caps would show on the side
        }, 256 * k, 128 * k);
      const makeMoonMap = (k) =>
        paint((p, w, h) => {
          p.fillStyle = "#e2e8f0";
          p.fillRect(0, 0, w, h);
          for (let i = 0; i < 22; i++) {
            const x = random() * w, y = 10 * k + random() * (h - 20 * k), r = (3 + random() * 9) * k;
            p.fillStyle = "#94a3b8";
            p.beginPath(); p.arc(x, y, r, 0, 7); p.fill();
            p.fillStyle = "#cbd5e1";
            p.beginPath(); p.arc(x - r * 0.25, y - r * 0.25, r * 0.65, 0, 7); p.fill();
          }
        }, 256 * k, 128 * k);
      const makeMarsMap = (k) =>
        paint((p, w, h) => {
          p.fillStyle = "#fb923c";
          p.fillRect(0, 0, w, h);
          blotches(p, ["#ea580c", "#c2410c", "#fdba74"], 10, 6 * k, 18 * k, w, h);
          if (k === 1) iceCaps(p, w, h, "#fff7ed");
        }, 256 * k, 128 * k);
      const earthMap = makeEarthMap(1);
      const moonMap = makeMoonMap(1);
      const marsMap = makeMarsMap(1);
      const cloudMap = paint((p, w, h) => blotches(p, ["rgba(255,255,255,0.95)"], 10, 4, 10, w, h));
      const panelMap = paint((p, w, h) => {
        p.fillStyle = "#1e3a8a";
        p.fillRect(0, 0, w, h);
        p.strokeStyle = "#60a5fa";
        p.lineWidth = 4;
        for (let x = 0; x <= w; x += w / 4) { p.beginPath(); p.moveTo(x, 0); p.lineTo(x, h); p.stroke(); }
        for (let y = 0; y <= h; y += h / 6) { p.beginPath(); p.moveTo(0, y); p.lineTo(w, y); p.stroke(); }
      }, 64, 128);

      // --- The objects ----------------------------------------------------------------------------
      const RADIUS = 0.32;
      const glass = toon("#7dd3fc", { transparent: true, opacity: 0.85 });
      const white = toon("#f8fafc");
      const grey = toon("#64748b");
      const orange = toon("#f97316");
      const dark = toon("#1e293b");

      const planet = (map) => part(new THREE.SphereGeometry(RADIUS, 48, 32), toon("#ffffff", { map }), 1.05);
      // The big planet behind the places once zoomed in: a smoother sphere, a sharper map, no clouds.
      const bigPlanet = (makeMap) => () => {
        const map = makeMap(4);
        map.anisotropy = renderer.capabilities.getMaxAnisotropy(); // stays sharp when seen at a grazing angle
        return part(new THREE.SphereGeometry(RADIUS, 192, 96), toon("#ffffff", { map }), 1.01);
      };

      // A small habitat dome with its antenna, on top of a planet.
      const dome = () => {
        const g = new THREE.Group();
        const bubble = part(new THREE.SphereGeometry(0.11, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), glass, 1.1);
        const base = part(new THREE.CylinderGeometry(0.125, 0.135, 0.04, 24), white, 1.1);
        base.position.y = -0.01;
        const mast = part(new THREE.CylinderGeometry(0.008, 0.008, 0.12, 8), grey, 1.3);
        mast.position.set(0.1, 0.06, 0);
        const ball = part(new THREE.SphereGeometry(0.022, 12, 12), orange, 1.2);
        ball.position.set(0.1, 0.13, 0);
        g.add(base, bubble, mast, ball);
        g.position.y = RADIUS - 0.02;
        return g;
      };

      const earth = () => {
        const g = new THREE.Group();
        g.add(planet(earthMap));
        const clouds = new THREE.Mesh(
          new THREE.SphereGeometry(RADIUS * 1.04, 48, 32),
          toon("#ffffff", { map: cloudMap, transparent: true, depthWrite: false }),
        );
        clouds.userData.extraSpin = 0.006;
        g.add(clouds);
        return g;
      };

      // Keep a tilt towards the camera while the object turns around its own vertical axis
      // (spinning the tilted object as a whole would make it wobble).
      const tilted = (content, tiltX, tiltZ = 0) => {
        const outer = new THREE.Group();
        const spinner = new THREE.Group();
        spinner.add(content);
        spinner.userData.extraSpin = 0.006;
        outer.add(spinner);
        outer.rotation.set(tiltX, 0, tiltZ);
        outer.userData.noPivotSpin = true;
        return outer;
      };

      const spacecraft = () => {
        const g = new THREE.Group();
        const body = part(new THREE.CapsuleGeometry(0.12, 0.2, 8, 24), white);
        const stripe = part(new THREE.TorusGeometry(0.122, 0.022, 10, 32), orange, 1.1);
        stripe.rotation.x = Math.PI / 2;
        stripe.position.y = -0.05;
        const window_ = part(new THREE.CircleGeometry(0.05, 24), glass, 1.15);
        window_.position.set(0, 0.07, 0.121);
        const nozzle = part(new THREE.CylinderGeometry(0.06, 0.09, 0.07, 20), grey);
        nozzle.position.y = -0.25;
        g.add(body, stripe, window_, nozzle);
        for (const side of [-1, 1]) {
          const wing = part(new THREE.BoxGeometry(0.2, 0.12, 0.012), toon("#ffffff", { map: panelMap }), 1.08);
          wing.position.set(side * 0.23, -0.16, 0); // arrays leave from the service module, below the capsule
          g.add(wing);
        }
        return g;
      };

      const station = () => {
        const g = new THREE.Group();
        // As on the ISS: the pressurized modules run perpendicular to the main truss that carries the arrays.
        const module = part(new THREE.CapsuleGeometry(0.06, 0.3, 8, 20), white);
        module.rotation.x = Math.PI / 2;
        const node = part(new THREE.SphereGeometry(0.075, 20, 16), white);
        const truss = part(new THREE.CylinderGeometry(0.014, 0.014, 0.85, 8), grey, 1.2);
        truss.rotation.z = Math.PI / 2;
        truss.position.y = 0.13;
        const mast = part(new THREE.CylinderGeometry(0.012, 0.012, 0.13, 8), grey, 1.2);
        mast.position.y = 0.07;
        g.add(module, node, truss, mast);
        for (const x of [-0.34, -0.2, 0.2, 0.34]) {
          const wing = part(new THREE.BoxGeometry(0.11, 0.34, 0.012), toon("#ffffff", { map: panelMap }), 1.06);
          wing.position.set(x, 0.13, 0);
          g.add(wing);
        }
        const tip = part(new THREE.SphereGeometry(0.03, 12, 12), orange, 1.2);
        tip.position.set(0, 0, 0.21);
        g.add(tip);
        return g;
      };

      // Earth with a tiny station on its orbit: the "Earth & orbit" choice.
      const earthSystem = () => {
        const g = earth();
        const orbit = new THREE.Group();
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.43, 0.004, 6, 64),
          new THREE.MeshBasicMaterial({ color: "#fdba74", transparent: true, opacity: 0.6 }), // orbit in light flame orange
        );
        ring.rotation.x = Math.PI / 2;
        const tiny = station();
        tiny.scale.setScalar(0.28);
        tiny.position.x = 0.43;
        orbit.add(ring, tiny);
        orbit.rotation.z = 0.35;
        orbit.userData.extraSpin = 0.02;
        g.add(orbit);
        return g;
      };

      const rover = () => {
        const g = new THREE.Group();
        const box = part(new THREE.BoxGeometry(0.46, 0.14, 0.26), white, 1.06);
        const stripe = part(new THREE.BoxGeometry(0.47, 0.035, 0.27), orange, 1.04);
        stripe.position.y = -0.02;
        const cabin = part(new THREE.SphereGeometry(0.12, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), glass, 1.08);
        cabin.position.set(0.09, 0.07, 0);
        const mast = part(new THREE.CylinderGeometry(0.008, 0.008, 0.16, 8), grey, 1.3);
        mast.position.set(-0.16, 0.15, 0.06);
        const ball = part(new THREE.SphereGeometry(0.025, 12, 12), orange, 1.2);
        ball.position.set(-0.16, 0.24, 0.06);
        g.add(box, stripe, cabin, mast, ball);
        for (const x of [-0.16, 0, 0.16]) {
          for (const z of [-0.15, 0.15]) {
            const wheel = part(new THREE.CylinderGeometry(0.065, 0.065, 0.05, 20), dark, 1.08);
            wheel.rotation.x = Math.PI / 2;
            wheel.position.set(x, -0.1, z);
            wheel.add(new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.052, 12), toon("#cbd5e1")));
            g.add(wheel);
          }
        }
        return g;
      };

      // A habitat: a big glass dome on a ring, with a solar panel and an antenna.
      const habitat = () => {
        const g = dome();
        g.scale.setScalar(2.1);
        g.position.y = -0.12;
        // A ground solar panel on a post, facing the sky (about 60 degrees up).
        const panel = part(new THREE.BoxGeometry(0.16, 0.1, 0.01), toon("#ffffff", { map: panelMap }), 1.08);
        panel.position.set(-0.27, 0.0, 0.05);
        panel.rotation.set(-1.05, 0, 0);
        const post = part(new THREE.CylinderGeometry(0.008, 0.008, 0.12, 8), grey, 1.3);
        post.position.set(-0.27, -0.07, 0.05);
        const g2 = new THREE.Group();
        g2.add(g, post, panel);
        return g2;
      };

      // A small lab building with two bushes: the "Earth" reference place.
      const lab = () => {
        const g = new THREE.Group();
        const walls = part(new THREE.BoxGeometry(0.3, 0.18, 0.22), white, 1.06);
        walls.position.y = -0.04;
        const roof = part(new THREE.ConeGeometry(0.24, 0.12, 4), orange, 1.06);
        roof.rotation.y = Math.PI / 4;
        roof.position.y = 0.11;
        const door = part(new THREE.BoxGeometry(0.06, 0.1, 0.01), toon("#38bdf8"), 1.1);
        door.position.set(0, -0.08, 0.111);
        g.add(walls, roof, door);
        for (const [x, r] of [[-0.22, 0.05], [0.21, 0.04]]) {
          const bush = part(new THREE.SphereGeometry(r, 16, 12), toon("#22c55e"), 1.12);
          bush.position.set(x, -0.13 + r * 0.8, 0.06);
          g.add(bush);
        }
        return g;
      };

      const builders = {
        earth_system: earthSystem,
        moon: () => planet(moonMap),
        mars: () => planet(marsMap),
        earth_ground: bigPlanet(makeEarthMap),
        moon_ground: bigPlanet(makeMoonMap),
        mars_ground: bigPlanet(makeMarsMap),
        earth: earth,
        earth_lab: lab,
        station: () => tilted(station(), 0.3),
        spacecraft: () => tilted(spacecraft(), 0.15, -0.45),
        base_moon: habitat,
        base_mars: habitat,
        rover_moon: rover,
      };

      // Places that stand on the ground. Once zoomed in, they sit directly on the planet's surface;
      // the others (station, spacecraft) stay above it, in orbit.
      const SURFACE = new Set(["earth_lab", "base_moon", "base_mars", "rover_moon"]);

      // --- Stars and the halo of the chosen object ------------------------------------------------
      const starPositions = [];
      for (let i = 0; i < 90; i++) starPositions.push((random() - 0.5) * 12, (random() - 0.5) * 2, -3);
      const stars = new THREE.Points(
        new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3)),
        new THREE.PointsMaterial({ color: "#e6e9f2", size: 2, sizeAttenuation: false, transparent: true, opacity: 0.6 }),
      );
      scene.add(stars);

      const halo = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: paint((p, w) => {
            const gradient = p.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
            gradient.addColorStop(0, "rgba(249,115,22,0.75)");
            gradient.addColorStop(0.55, "rgba(249,115,22,0.25)");
            gradient.addColorStop(1, "rgba(249,115,22,0)");
            p.fillStyle = gradient;
            p.fillRect(0, 0, w, w);
          }, 128, 128),
          transparent: true,
          depthWrite: false,
        }),
      );
      halo.scale.set(1.15, 1.15, 1);
      halo.position.z = -1; // in front of the backdrop planet, behind the objects

      const zoomedIn = Boolean(settings.backdrop);
      const pivots = settings.objects.map((name, i) => {
        const pivot = new THREE.Group(); // the pivot floats and spins, or sits on the ground
        const content = (builders[name] ?? builders.moon)();
        pivot.add(content);
        const chosen = i === settings.chosen;
        pivot.userData.onSurface = zoomedIn && SURFACE.has(name);
        if (pivot.userData.onSurface) {
          // Seen from slightly above, three-quarter view, with its lowest point at the pivot (on the ground).
          content.rotation.set(0.12, -0.5, 0);
          const box = new THREE.Box3().setFromObject(content);
          content.position.y -= box.min.y;
          pivot.userData.size = chosen ? 1.5 : 1.3;
        } else {
          pivot.userData.size = (zoomedIn ? 1.4 : 1.0) * (chosen ? 1.2 : 0.95);
        }
        pivot.scale.setScalar(pivot.userData.size);
        if (chosen) scene.add(halo);
        scene.add(pivot);
        return pivot;
      });
      if (zoomedIn) halo.scale.set(1.6, 1.6, 1);

      // Once zoomed in, the chosen body becomes a huge planet: its surface is the horizon at the bottom.
      const BACKDROP_SIZE = 16;
      const HORIZON = -0.4; // height of the top of the planet, in the middle of the frame
      const planetRadius = RADIUS * BACKDROP_SIZE;
      const planetCentreY = HORIZON - planetRadius;
      const surfaceY = (x) => planetCentreY + Math.sqrt(Math.max(planetRadius ** 2 - x ** 2, 0));
      const ORBIT_Y = 0.12;

      let backdrop = null;
      if (zoomedIn) {
        backdrop = new THREE.Group();
        backdrop.add(builders[settings.backdrop]());
        backdrop.position.z = -1.5;
        scene.add(backdrop);
      }

      // The zoom: the body leaves its column among Earth, Moon and Mars, grows and sinks to the bottom,
      // then the places pop up one after the other.
      const ZOOM_MS = 1400;
      const zooming = settings.zoomFrom >= 0 && !reducedMotion;
      let zoomStart = null;
      let halfWidth = 1;
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const clamp01 = (t) => Math.min(Math.max(t, 0), 1);

      const placeBackdrop = (progress) => {
        if (!backdrop) return;
        const t = ease(progress);
        const startX = -halfWidth + ((settings.zoomFrom + 0.5) * 2 * halfWidth) / 3;
        backdrop.position.x = settings.zoomFrom >= 0 ? startX * (1 - t) : 0;
        backdrop.position.y = planetCentreY * t;
        backdrop.scale.setScalar(0.95 + (BACKDROP_SIZE - 0.95) * t);
        // Turn the planet a quarter so the horizon shows its equator (oceans, land), not an ice cap.
        backdrop.children[0].rotation.z = (Math.PI / 2) * t;
      };

      const resize = () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height);
        halfWidth = HALF_HEIGHT * (width / height);
        camera.left = -halfWidth;
        camera.right = halfWidth;
        camera.updateProjectionMatrix();
        // Middle of column i, in scene units. Ground places sit on the curved surface and lean with it.
        pivots.forEach((pivot, i) => {
          const x = -halfWidth + ((i + 0.5) * 2 * halfWidth) / count;
          pivot.position.x = x;
          if (pivot.userData.onSurface) {
            pivot.position.y = surfaceY(x) - 0.02;
            pivot.rotation.z = -Math.asin(x / planetRadius);
          }
        });
        if (settings.chosen >= 0) {
          const chosen = pivots[settings.chosen];
          halo.position.x = chosen.position.x;
          halo.position.y = chosen.userData.onSurface ? chosen.position.y + 0.3 : zoomedIn ? ORBIT_Y : 0;
        }
        if (!zooming) placeBackdrop(1);
      };
      window.addEventListener("resize", resize);
      resize();

      const draw = (time = 0) => {
        let progress = 1;
        if (zooming) {
          zoomStart ??= time;
          progress = clamp01((time - zoomStart) / ZOOM_MS);
          placeBackdrop(progress);
        }
        pivots.forEach((pivot, i) => {
          const chosen = i === settings.chosen;
          // During the zoom, each place pops up (from the ground) once the planet has mostly settled.
          const popIn = zooming ? ease(clamp01((progress - 0.55 - i * 0.12) / 0.3)) : 1;
          pivot.scale.setScalar(Math.max(pivot.userData.size * popIn, 0.0001));
          if (pivot.userData.onSurface) return; // standing still on the ground
          if (!pivot.children[0].userData.noPivotSpin) pivot.rotation.y += chosen ? 0.014 : 0.005;
          const floatY = zoomedIn ? ORBIT_Y : 0;
          pivot.position.y = floatY + (chosen ? 0.05 : 0.035) * Math.sin(time / 650 + i * 1.3);
          pivot.traverse((piece) => {
            if (piece.userData.extraSpin) piece.rotation.y += piece.userData.extraSpin;
          });
        });
        if (backdrop && !zoomedIn) backdrop.rotation.y += 0.0015;
        halo.material.opacity = 0.75 + 0.25 * Math.sin(time / 450);
        stars.material.opacity = 0.55 + 0.2 * Math.sin(time / 900);
        renderer.render(scene, camera);
      };

      if (reducedMotion) {
        draw();
      } else {
        renderer.setAnimationLoop(draw);
      }
    </script>
  </body>
</html>
