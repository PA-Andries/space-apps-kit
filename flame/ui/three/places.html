<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { height: 100%; margin: 0; }
      html { background: transparent; }
      body { overflow: hidden; border-radius: 22px; background: radial-gradient(ellipse at 50% 38%, #141c30 0%, #080b14 72%); }
      canvas { display: block; }
      #error { color: #9ca3af; font: 14px sans-serif; padding: 16px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      // Realistic 3D objects to choose from. First view: Earth (with the station's orbit), Moon, Mars side by side.
      // Zoomed view: the whole planet in the middle, with what belongs to it (the station and the spacecraft on
      // their orbit around Earth, the pressurized rover on the edge of the Moon).
      //
      // Planet maps are NASA images (see assets/README.md), sent by Python as data URLs. The station (ISS type),
      // the spacecraft (Orion type) and the rover (Space Exploration Vehicle type) are simplified shapes drawn here.
      //
      // The scene reads in the page which button is chosen (it may: same origin) and sends nothing back. So its
      // HTML does not change with the choice, and Streamlit does not reload it on each click.
      //
      // Each object is drawn at the centre of its "zone" (cx, cy in fractions of the frame). Python places a
      // transparent round Streamlit button over each zone: the click goes to that button, and the scene sends
      // nothing back to Python. Moving objects therefore never leave their zone.
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      // Replaced by Python: { objects, zones: [{cx, cy, w, h}], pickKey: key of the buttons' container,
      // zoomFrom: 0-2 or -1, assets: { earth, moon, mars: data URLs, only those needed } }
      const settings = __SETTINGS__;
      const assets = settings.assets ?? {};
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      } catch (e) {
        document.body.innerHTML = '<p id="error">The 3D scene needs WebGL, which this browser does not offer.</p>';
        throw e;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping; // film-like response, as in game engines
      renderer.toneMappingExposure = 1.05;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      // Orthographic camera: the visible height is fixed (objects keep their size), the width follows the frame.
      const HALF_HEIGHT = 0.68;
      const camera = new THREE.OrthographicCamera(-1, 1, HALF_HEIGHT, -HALF_HEIGHT, 0.1, 20);
      camera.position.set(0, 0, 10);

      // One sun, front left: the day side faces us, the night side shows on the right edge.
      const sun = new THREE.DirectionalLight(0xffffff, 3.2);
      sun.position.set(-4, 1.8, 4.5);
      scene.add(sun);
      scene.add(new THREE.HemisphereLight(0xc8d8ff, 0x0b1020, 0.35)); // faint fill, so the night side is not black
      scene.add(new THREE.AmbientLight(0x8090b0, 0.08));

      // --- Loading the NASA maps (data URLs written in the page by Python) -----------------------------
      const manager = new THREE.LoadingManager();
      const textureLoader = new THREE.TextureLoader(manager);
      const mapOf = (name) => {
        if (!assets[name]) return null;
        const texture = textureLoader.load(assets[name]);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
      };

      // A canvas drawing used as a texture (solar cells, glows).
      const paint = (drawing, width = 256, height = 256) => {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        drawing(canvas.getContext("2d"), width, height);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      };

      let seed = 11;
      const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const DEG = Math.PI / 180;

      // --- Planets -----------------------------------------------------------------------------------
      const RADIUS = 0.32;

      // Turn around a tilted axis (the planet's real axial tilt) without wobbling.
      const tilted = (content, tiltX, tiltZ = 0, spin = 0.0015) => {
        const outer = new THREE.Group();
        const spinner = new THREE.Group();
        spinner.add(content);
        spinner.userData.spin = spin;
        outer.add(spinner);
        outer.rotation.set(tiltX, 0, tiltZ);
        return outer;
      };

      // The atmosphere seen edge-on: a halo just outside the disc, fading outwards (behind the planet).
      const halo = (rgb, strength, reach) => {
        const inner = 1 / reach;
        const glow = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: paint((p, w) => {
              const g = p.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
              g.addColorStop(0, `rgba(${rgb}, ${strength})`);
              g.addColorStop(inner * 0.985, `rgba(${rgb}, ${strength})`);
              g.addColorStop(inner + (1 - inner) * 0.25, `rgba(${rgb}, ${strength * 0.35})`);
              g.addColorStop(1, `rgba(${rgb}, 0)`);
              p.fillStyle = g;
              p.fillRect(0, 0, w, w);
            }),
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
          }),
        );
        glow.scale.set(2 * RADIUS * reach, 2 * RADIUS * reach, 1);
        return glow;
      };

      // The atmosphere seen through: a thin haze brightening towards the limb, on the day side.
      const limbHaze = (color, strength) =>
        new THREE.Mesh(
          new THREE.SphereGeometry(RADIUS * 1.012, 96, 48),
          new THREE.ShaderMaterial({
            uniforms: { tint: { value: new THREE.Color(color) }, strength: { value: strength }, sunDir: { value: sun.position.clone().normalize() } },
            vertexShader: `
              varying vec3 vNormal; varying vec3 vWorldNormal;
              void main() {
                vNormal = normalize(normalMatrix * normal);
                vWorldNormal = normalize(mat3(modelMatrix) * normal);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }`,
            fragmentShader: `
              uniform vec3 tint; uniform float strength; uniform vec3 sunDir;
              varying vec3 vNormal; varying vec3 vWorldNormal;
              void main() {
                float rim = pow(1.0 - max(dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 3.0);
                float day = smoothstep(-0.25, 0.4, dot(vWorldNormal, sunDir));
                gl_FragColor = vec4(tint * rim * day * strength, 1.0);
              }`,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
          }),
        );

      // `lift`: a little of the map's own light, so dark oceans and the night side keep some detail.
      const sphere = (map, roughness = 1, lift = 0.06) =>
        new THREE.Mesh(
          new THREE.SphereGeometry(RADIUS, 128, 64),
          new THREE.MeshStandardMaterial({
            map, color: map ? 0xffffff : 0x888888, roughness, metalness: 0,
            emissive: 0xffffff, emissiveMap: map, emissiveIntensity: map ? lift : 0,
          }),
        );

      // Axial tilts: Earth 23.4°, Mars 25.2°, Moon 1.5° (to the ecliptic).
      const earth = (withHalo = true) => {
        const g = new THREE.Group();
        const body = sphere(mapOf("earth"), 0.7, 0.22);
        body.add(limbHaze("#6fa8ff", 0.9));
        g.add(tilted(body, 0.12, -23.4 * DEG));
        if (withHalo) g.add(halo("95, 155, 255", 0.42, 1.16));
        return g;
      };
      const moon = () => tilted(sphere(mapOf("moon"), 1), 0.05, -1.5 * DEG, 0.001);
      const mars = () => {
        const g = new THREE.Group();
        const body = sphere(mapOf("mars"), 0.95);
        body.add(limbHaze("#e8a27a", 0.35));
        g.add(tilted(body, 0.1, -25.2 * DEG, 0.0014), halo("225, 140, 100", 0.12, 1.08));
        return g;
      };

      // --- Station, spacecraft and rover: realistic shapes and materials --------------------------------
      // A soft studio light reflected by metals and foils (planets ignore it: they keep the sun only).
      const pmrem = new THREE.PMREMGenerator(renderer);
      const studio = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const metal = (color, roughness, metalness, map = null) =>
        new THREE.MeshStandardMaterial({ color, roughness, metalness, map, envMap: studio, envMapIntensity: 0.9 });

      // Solar cells: a grid of cells with thin bright lines between them.
      const cellMap = (cell, line, columns, rows) =>
        paint((p, w, h) => {
          p.fillStyle = line;
          p.fillRect(0, 0, w, h);
          const cw = w / columns, ch = h / rows;
          for (let x = 0; x < columns; x++) {
            for (let y = 0; y < rows; y++) {
              p.fillStyle = cell;
              p.globalAlpha = 0.86 + 0.14 * random();
              p.fillRect(x * cw + 1.5, y * ch + 1.5, cw - 3, ch - 3);
            }
          }
          p.globalAlpha = 1;
        }, 128, 512);
      // Insulation blankets (MLI): off-white panels with soft seams.
      const blanket = paint((p, w, h) => {
        p.fillStyle = "#e9e9e4";
        p.fillRect(0, 0, w, h);
        for (let x = 0; x < w; x += w / 8) {
          p.fillStyle = `rgba(120, 120, 110, ${0.12 + 0.1 * random()})`;
          p.fillRect(x, 0, 2, h);
        }
        for (let y = 0; y < h; y += h / 4) {
          p.fillStyle = "rgba(120, 120, 110, 0.18)";
          p.fillRect(0, y, w, 2);
        }
      }, 256, 128);
      // Truss: a lattice of girders.
      const lattice = paint((p, w, h) => {
        p.clearRect(0, 0, w, h);
        p.strokeStyle = "#b9bec6";
        p.lineWidth = 5;
        p.strokeRect(2, 2, w - 4, h - 4);
        for (let x = 0; x < w; x += h) {
          p.beginPath(); p.moveTo(x, 0); p.lineTo(x + h, h); p.moveTo(x + h, 0); p.lineTo(x, h); p.stroke();
        }
      }, 512, 32);
      lattice.wrapS = THREE.RepeatWrapping;

      const issCells = metal("#ffffff", 0.32, 0.6, cellMap("#b07a2a", "#e8d3a0", 4, 16)); // the ISS's golden wings
      const orionCells = metal("#ffffff", 0.3, 0.6, cellMap("#1a2440", "#5d6c8c", 3, 12));
      const mli = metal("#ffffff", 0.75, 0.05, blanket);
      const goldFoil = metal("#d4a64a", 0.32, 0.95);
      const aluminium = metal("#c9ccd2", 0.3, 0.9);
      const gunmetal = metal("#4a4f58", 0.45, 0.8);
      const white = metal("#f1f1ee", 0.55, 0.05);
      const tyre = metal("#25282d", 0.85, 0.1);
      const window_ = metal("#22344f", 0.05, 0.9);
      const trussMaterial = new THREE.MeshStandardMaterial({ map: lattice, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide, roughness: 0.4, metalness: 0.8, envMap: studio });

      const tube = (radius, length, material, axis = "y") => {
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 40), material);
        if (axis === "x") mesh.rotation.z = Math.PI / 2;
        if (axis === "z") mesh.rotation.x = Math.PI / 2;
        return mesh;
      };
      const box = (x, y, z, material) => new THREE.Mesh(new THREE.BoxGeometry(x, y, z), material);

      // The International Space Station: a long truss, eight golden array wings (four at each end, above and
      // below), pressurized modules across the middle, and white radiators.
      const station = () => {
        const g = new THREE.Group();
        const truss = box(0.82, 0.03, 0.03, trussMaterial);
        lattice.repeat.set(10, 1);
        g.add(truss, tube(0.006, 0.82, aluminium, "x"));
        for (const x of [-0.37, -0.28, 0.28, 0.37]) {
          for (const side of [1, -1]) {
            const wingGroup = new THREE.Group();
            const mast = tube(0.003, 0.25, aluminium);
            mast.position.y = side * 0.14;
            const blanketWing = box(0.07, 0.24, 0.003, issCells);
            blanketWing.position.set(0, side * 0.145, 0);
            wingGroup.add(mast, blanketWing);
            wingGroup.position.x = x;
            wingGroup.rotation.y = 0.25; // arrays turned a little towards the sun
            g.add(wingGroup);
          }
          const joint = tube(0.014, 0.03, gunmetal, "x");
          joint.position.x = x;
          g.add(joint);
        }
        // Modules: a chain towards us and away from us, and two side labs.
        const chain = tube(0.032, 0.38, mli, "z");
        chain.position.y = -0.035;
        const node = new THREE.Mesh(new THREE.SphereGeometry(0.04, 32, 20), mli);
        node.position.y = -0.035;
        const lab1 = tube(0.03, 0.12, mli, "x");
        lab1.position.set(0.08, -0.035, 0.06);
        const lab2 = tube(0.03, 0.1, mli, "x");
        lab2.position.set(-0.075, -0.035, 0.06);
        const serviceArrays = box(0.16, 0.002, 0.04, orionCells);
        serviceArrays.position.set(0, -0.035, -0.17);
        g.add(chain, node, lab1, lab2, serviceArrays);
        for (const x of [-0.13, 0.13]) {
          const radiator = box(0.05, 0.002, 0.13, white);
          radiator.position.set(x, 0, -0.05);
          g.add(radiator);
        }
        return g;
      };

      // A crew spacecraft of the Orion type: silver capsule with small windows, heat shield, service module in
      // gold foil with a white band, four solar wings in an X, main engine.
      const spacecraft = () => {
        const g = new THREE.Group();
        const capsule = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.12, 0.125, 64), aluminium);
        capsule.position.y = 0.2;
        const dock = tube(0.03, 0.03, gunmetal);
        dock.position.y = 0.277;
        for (const angle of [-0.35, 0.35]) {
          const pane = box(0.022, 0.018, 0.004, window_);
          pane.position.set(Math.sin(angle) * 0.088, 0.21, Math.cos(angle) * 0.088);
          pane.rotation.set(-0.55, angle, 0);
          g.add(pane);
        }
        const shield = tube(0.122, 0.012, gunmetal);
        shield.position.y = 0.132;
        const adapter = new THREE.Mesh(new THREE.CylinderGeometry(0.108, 0.118, 0.028, 64), white);
        adapter.position.y = 0.112;
        const service = tube(0.108, 0.17, goldFoil);
        const band = tube(0.11, 0.035, white);
        band.position.y = 0.05;
        const engine = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.055, 0.075, 40, 1, true), gunmetal);
        engine.position.y = -0.12;
        engine.material.side = THREE.DoubleSide;
        g.add(capsule, dock, shield, adapter, service, band, engine);
        for (let k = 0; k < 4; k++) {
          const arm = new THREE.Group();
          for (let s2 = 0; s2 < 3; s2++) {
            const panel = box(0.1, 0.003, 0.08, orionCells);
            panel.position.x = 0.17 + s2 * 0.104;
            arm.add(panel);
          }
          const strut = tube(0.004, 0.07, aluminium, "x");
          strut.position.x = 0.11;
          arm.add(strut);
          arm.rotation.y = (45 + 90 * k) * DEG;
          arm.position.y = -0.03;
          g.add(arm);
        }
        return g;
      };

      // A pressurized rover of the Space Exploration Vehicle type: a cabin with a wrap-around window front,
      // two suit ports at the back, a docking hatch on top, twelve wheels on six axles.
      const rover = () => {
        const g = new THREE.Group();
        const profile = new THREE.Shape();
        profile.moveTo(-0.2, -0.05);
        profile.lineTo(0.15, -0.05);
        profile.lineTo(0.215, 0.01);
        profile.lineTo(0.17, 0.1);
        profile.lineTo(-0.2, 0.1);
        profile.closePath();
        const cabinGeometry = new THREE.ExtrudeGeometry(profile, { depth: 0.2, bevelEnabled: true, bevelSize: 0.014, bevelThickness: 0.014, bevelSegments: 4 });
        cabinGeometry.translate(0, 0, -0.1);
        const cabin = new THREE.Mesh(cabinGeometry, white);
        const front = box(0.006, 0.085, 0.19, window_);
        front.position.set(0.209, 0.064, 0); // out of the bevel, on the sloped front
        front.rotation.z = -Math.atan2(0.045, 0.09);
        const lower = box(0.006, 0.05, 0.17, window_);
        lower.position.set(0.206, -0.028, 0);
        lower.rotation.z = Math.atan2(0.065, 0.06);
        const sideWindows = box(0.12, 0.04, 0.236, window_);
        sideWindows.position.set(0.085, 0.06, 0);
        const hatch = tube(0.035, 0.02, aluminium);
        hatch.position.set(-0.06, 0.122, 0);
        const chassis = box(0.42, 0.028, 0.18, gunmetal);
        chassis.position.y = -0.075;
        g.add(cabin, front, lower, sideWindows, hatch, chassis);
        for (const z of [-0.04, 0.04]) {
          const port = new THREE.Mesh(new THREE.TorusGeometry(0.026, 0.007, 14, 36), aluminium);
          port.rotation.y = Math.PI / 2;
          port.position.set(-0.216, 0.025, z);
          g.add(port);
        }
        for (const x of [-0.165, -0.105, -0.045, 0.045, 0.105, 0.165]) {
          for (const z of [-0.11, 0.11]) {
            const wheel = tube(0.033, 0.03, tyre, "z");
            wheel.position.set(x, -0.1, z);
            const rim = tube(0.016, 0.032, aluminium, "z");
            rim.position.copy(wheel.position);
            g.add(wheel, rim);
          }
        }
        g.rotation.set(0.3, -0.75, 0); // three-quarter front view from slightly above
        const outer = new THREE.Group();
        outer.add(g);
        return outer;
      };

      // Earth with the station's orbit, inclined 51.6° like the ISS: the "Earth & orbit" choice of the first view.
      const ORBIT_RADIUS = 0.43;
      const earthSystem = () => {
        const g = earth();
        const orbit = new THREE.Group();
        const points = [];
        for (let i = 0; i <= 160; i++) {
          const t = (i / 160) * Math.PI * 2;
          points.push(new THREE.Vector3(ORBIT_RADIUS * Math.cos(t), 0, ORBIT_RADIUS * Math.sin(t)));
        }
        const ring = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(points),
          new THREE.LineBasicMaterial({ color: "#cfe0ff", transparent: true, opacity: 0.45 }),
        );
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.014, 16, 12), new THREE.MeshBasicMaterial({ color: "#ffffff" }));
        dot.position.x = ORBIT_RADIUS;
        const carrier = new THREE.Group();
        carrier.add(dot);
        carrier.userData.spin = 0.012;
        orbit.add(ring, carrier);
        orbit.rotation.set(0.28, 0, 0.5);
        g.add(orbit);
        return g;
      };

      // How each object behaves: "planet" in the middle of the zoomed view, "orbit" around it,
      // "limb" driving on its edge, or "float" (first view: still in its column).
      const kinds = {
        earth_system: ["float", earthSystem],
        moon: ["float", moon],
        mars: ["float", mars],
        earth_whole: ["planet", earth],
        moon_whole: ["planet", moon],
        mars_whole: ["planet", mars],
        station: ["orbit", () => tilted(station(), 0.5, 0.1, 0.003)],
        spacecraft: ["orbit", () => tilted(spacecraft(), 0.45, -0.35, 0.004)],
        rover_moon: ["limb", rover],
      };

      // --- Stars: many faint points of different brightness ------------------------------------------
      const starLayer = (count, size, opacity) => {
        const positions = [];
        for (let i = 0; i < count; i++) positions.push((random() - 0.5) * 12, (random() - 0.5) * 2, -5);
        return new THREE.Points(
          new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(positions, 3)),
          new THREE.PointsMaterial({ color: "#dfe7ff", size, sizeAttenuation: false, transparent: true, opacity }),
        );
      };
      scene.add(starLayer(500, 1, 0.45), starLayer(90, 1.6, 0.7), starLayer(14, 2.2, 0.85));

      // --- The chosen object: a thin orange ring with four ticks, slowly turning --------------------
      const marker = new THREE.Group();
      const markerMaterial = new THREE.MeshBasicMaterial({ color: "#f07a3a", transparent: true, opacity: 0.9 });
      marker.add(new THREE.Mesh(new THREE.RingGeometry(0.995, 1, 160), markerMaterial));
      for (let k = 0; k < 4; k++) {
        const tick = new THREE.Mesh(new THREE.PlaneGeometry(0.07, 0.008), markerMaterial);
        const angle = (k * Math.PI) / 2;
        tick.position.set(Math.cos(angle) * 1.02, Math.sin(angle) * 1.02, 0);
        tick.rotation.z = angle;
        marker.add(tick);
      }
      marker.position.z = 3;
      scene.add(marker);

      // Which object is chosen: the index of the highlighted ("primary") button over the objects, in the page.
      const readChosen = () => {
        try {
          const box = window.parent.document.querySelector(`.st-key-${settings.pickKey}`);
          const buttons = box ? [...box.querySelectorAll("button")] : [];
          return buttons.findIndex((button) => button.getAttribute("kind") === "primary");
        } catch (e) {
          return -1; // the page cannot be read: nothing highlighted
        }
      };
      let chosenIndex = readChosen();
      setInterval(() => { chosenIndex = readChosen(); }, 200);

      // --- Build the objects ----------------------------------------------------------------------
      const items = settings.objects.map((name, i) => {
        const [kind, build] = kinds[name] ?? kinds.moon;
        const pivot = new THREE.Group();
        pivot.add(build());
        scene.add(pivot);
        const size = { planet: 1.45, orbit: 0.8, limb: 0.55, float: 0.95 }[kind];
        return { name, kind, pivot, chosen: false, size, zone: settings.zones[i], phase: i * 1.7 };
      });
      const centre = items.find((item) => item.kind === "planet");

      // The orbit around the middle planet: a thin line, hidden where it passes behind the planet.
      let orbitLine = null;
      if (centre && items.some((item) => item.kind === "orbit")) {
        const points = Array.from({ length: 241 }, () => new THREE.Vector3());
        orbitLine = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(points),
          new THREE.LineBasicMaterial({ color: "#cfe0ff", transparent: true, opacity: 0.4 }),
        );
        scene.add(orbitLine);
      }

      // --- Layout: from a zone (fractions of the frame) to scene units ----------------------------
      let halfWidth = 1;
      const zoneCentre = (zone) => ({
        x: -halfWidth + 2 * halfWidth * zone.cx,
        y: HALF_HEIGHT - 2 * HALF_HEIGHT * zone.cy,
      });
      let orbit = { a: 1, b: 0.2 }; // half-axes of the orbit ellipse

      const ORBIT_SWING = 0.4; // radians: how far the station and spacecraft slide along their orbit
      const LIMB_SWING = 0.22; // radians: how far the rover drives along the edge

      // Position of an item at time `time` (ms). Returns {x, y, z, angle}.
      const where = (item, time) => {
        const home = zoneCentre(item.zone);
        if (!centre || item.kind === "float" || item.kind === "planet") return { ...home, z: 0, angle: 0 };
        const c = zoneCentre(centre.zone);
        const sway = reducedMotion ? 0 : Math.sin(time / 2600 + item.phase);
        if (item.kind === "orbit") {
          const start = home.x < c.x ? Math.PI : 0;
          const theta = start + ORBIT_SWING * sway;
          return { x: c.x + orbit.a * Math.cos(theta), y: c.y + orbit.b * Math.sin(theta), z: 0.6, angle: 0 };
        }
        // limb: on the planet's edge, pointing outwards, around the direction of its zone
        const r = RADIUS * centre.size + 0.12 * item.size; // wheels on the ground
        const start = Math.atan2(home.y - c.y, home.x - c.x);
        const phi = start + LIMB_SWING * sway;
        return { x: c.x + r * Math.cos(phi), y: c.y + r * Math.sin(phi), z: 0.6, angle: phi - Math.PI / 2 };
      };

      const resize = () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height);
        halfWidth = HALF_HEIGHT * (width / height);
        camera.left = -halfWidth;
        camera.right = halfWidth;
        camera.updateProjectionMatrix();
        if (centre) {
          const c = zoneCentre(centre.zone);
          const side = items.find((item) => item.kind === "orbit");
          orbit = { a: side ? Math.abs(zoneCentre(side.zone).x - c.x) : 1, b: 0.16 };
        }
      };
      window.addEventListener("resize", resize);
      resize();

      // --- The zoom: the planet comes from its column of the first view and grows in the middle ---
      const ZOOM_MS = 1300;
      // Play it only when arriving on this view: the page remembers the last view shown, across Streamlit reruns.
      const view = settings.objects.join(",");
      let arriving = true;
      try {
        arriving = window.parent.ffLastView !== view;
        window.parent.ffLastView = view;
      } catch (e) {}
      const zooming = settings.zoomFrom >= 0 && centre && !reducedMotion && arriving;
      let zoomStart = null;
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const clamp01 = (t) => Math.min(Math.max(t, 0), 1);

      const draw = (time = 0) => {
        let progress = 1;
        if (zooming) {
          zoomStart ??= time;
          progress = clamp01((time - zoomStart) / ZOOM_MS);
        }
        marker.visible = chosenIndex >= 0;
        items.forEach((item, i) => {
          item.chosen = i === chosenIndex;
          let { x, y, z, angle } = where(item, time);
          let scale = item.size * (item.chosen ? 1.06 : 1);
          if (item === centre && progress < 1) {
            // From the column it had among Earth, Moon and Mars, at its first-view size.
            const t = ease(progress);
            const start = zoneCentre({ cx: (settings.zoomFrom + 0.5) / 3, cy: 0.48 });
            x = start.x + (x - start.x) * t;
            y = start.y + (y - start.y) * t;
            scale = 0.95 + (scale - 0.95) * t;
          } else if (item !== centre && zooming) {
            scale *= ease(clamp01((progress - 0.6 - i * 0.08) / 0.3)); // appear once the planet is in place
          }
          item.pivot.position.set(x, y, z);
          item.pivot.rotation.z = angle;
          item.pivot.scale.setScalar(Math.max(scale, 0.0001));
          if (!reducedMotion) {
            item.pivot.traverse((piece) => {
              if (piece.userData.spin) piece.rotation.y += piece.userData.spin * (item.chosen ? 2 : 1);
            });
          }
          if (item.chosen) {
            marker.position.x = x;
            marker.position.y = y;
            // Half the object's span, at scale 1: the ring goes just around it.
            const extent = item.name === "earth_system" ? ORBIT_RADIUS * 1.1 : { planet: RADIUS * 1.22, float: RADIUS * 1.3, orbit: 0.45, limb: 0.3 }[item.kind];
            marker.scale.set(extent * scale, extent * scale, 1);
          }
        });

        if (orbitLine && centre) {
          const c = centre.pivot.position;
          const positions = orbitLine.geometry.attributes.position;
          for (let i = 0; i < positions.count; i++) {
            const theta = (i / (positions.count - 1)) * Math.PI * 2;
            // The far half (z < 0) passes behind the planet, which hides it.
            positions.setXYZ(i, c.x + orbit.a * Math.cos(theta), c.y + orbit.b * Math.sin(theta), Math.sin(theta) * 0.5);
          }
          positions.needsUpdate = true;
          orbitLine.material.opacity = 0.4 * (zooming ? clamp01((progress - 0.5) / 0.3) : 1);
        }

        if (!reducedMotion) marker.rotation.z = time / 6000;
        markerMaterial.opacity = 0.75 + 0.2 * Math.sin(time / 700);
        renderer.render(scene, camera);
      };

      if (reducedMotion) {
        manager.onLoad = () => draw();
        setInterval(() => draw(), 250); // still: redraw only to follow the chosen object
        draw();
      } else {
        renderer.setAnimationLoop(draw);
      }
    </script>
  </body>
</html>
